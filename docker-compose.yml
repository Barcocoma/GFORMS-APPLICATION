version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: gleentforms-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-gleentforms}
      MYSQL_USER: ${DB_USER:-gleentforms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rootpassword}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gleentforms-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-gleentforms}
      DB_USER: ${DB_USER:-gleentforms_user}
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      DB_PORT: 3306
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_APP: backend/app.py
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend:ro
      - ./database:/app/database:ro
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        sleep 10 &&
        python database/init_db.py || echo 'Database initialization skipped' &&
        python backend/app.py
      "

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gleentforms-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000
    # Note: For development, use docker-compose.dev.yml instead
    # This production setup builds static files and doesn't mount volumes

volumes:
  db_data:

networks:
  default:
    name: gleentforms-network

